<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} | DevTune</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Geist, system-ui, "Segoe UI", sans-serif;
        color: #eef2f8;
        background: #05060a;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(1200px 600px at 80% -200px, #4a6cf738, transparent 65%),
          radial-gradient(900px 500px at -5% 15%, #a78bfa24, transparent 60%),
          radial-gradient(700px 500px at 55% 110%, #34d9e81a, transparent 65%);
      }
      main {
        width: min(100%, 512px);
        padding: clamp(24px, 6vw, 36px);
        border: 1px solid transparent;
        border-radius: 16px;
        background:
          linear-gradient(#0b0e15, #0b0e15) padding-box,
          linear-gradient(135deg, #4a6cf7, #a78bfa 50%, #34d9e8) border-box;
        box-shadow: 0 16px 40px -12px #4a6cf740;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #eef2f8;
        font-size: 14px;
        font-weight: 600;
      }
      .product-icon {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid #2a3345;
        border-radius: 10px;
        background: #11151f;
      }
      .brand-divider { width: 1px; height: 16px; background: #2a3345; }
      .service { color: #8b95a7; font-weight: 500; }
      .result-icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        margin-top: 28px;
        border: 1px solid #34d3994d;
        border-radius: 14px;
        color: #34d399;
        background: #34d39914;
      }
      [data-result="error"] .result-icon {
        border-color: #fb71854d;
        color: #fb7185;
        background: #fb718514;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: clamp(22px, 5vw, 28px);
        line-height: 1.2;
        letter-spacing: -0.025em;
      }
      p { margin: 0; color: #8b95a7; font-size: 14px; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main aria-labelledby="result-title" data-result="{{result}}">
      <div class="brand">
        <span class="product-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 64 64" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="#eeefeb" d="M20 8 8 16v29l12 11 12-10 12 10 12-11V16L44 8"/>
            <path stroke="#67a8b8" d="M32 19v20M23.34 24l17.32 10M23.34 34l17.32-10"/>
          </svg>
        </span>
        <span>PassWards</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="service">DevTune</span>
      </div>
      <div class="result-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="{{icon}}"/>
        </svg>
      </div>
      <h1 id="result-title">{{title}}</h1>
      <p>{{detail}}</p>
    </main>
  </body>
</html>
