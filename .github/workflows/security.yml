name: Offline app security checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked developer dependencies
        run: |
          npm install --global pnpm@12.5.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
      - name: Prepare verified RustSec auditor
        run: |
          $taskTools = Join-Path $env:RUNNER_TEMP 'passwards-rustsec'
          New-Item -ItemType Directory -Path $taskTools -Force | Out-Null
          $taskArchive = Join-Path $taskTools 'cargo-audit.zip'
          Invoke-WebRequest -Uri 'https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-pc-windows-msvc-v0.22.2.zip' -OutFile $taskArchive
          if ((Get-FileHash -LiteralPath $taskArchive -Algorithm SHA256).Hash -ne '0a7316540862c13d954f648917ceacca593747baed6eec180fafa590be2710ab') { throw 'Auditor checksum mismatch' }
          Expand-Archive -LiteralPath $taskArchive -DestinationPath $taskTools
          (Get-ChildItem -LiteralPath $taskTools -Recurse -Filter cargo-audit.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - name: Audit dependencies and run core security regressions
        run: ./scripts/check-security.ps1
      - name: Build standalone executable without an installer
        run: pnpm tauri build --no-bundle
